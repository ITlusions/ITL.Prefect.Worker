prefect-worker:
  worker:
    image:
      prefectTag: 3.8.8-python3.11-kubernetes
    config:
      workPool: itl-amalia
      name: itl-worker-01
    apiConfig: selfHostedServer
    selfHostedServerApiConfig:
      # In-cluster service: traffic stays inside the cluster and skips the ingress
      apiUrl: http://prefect-server.prefect.svc.cluster.local:4200/api
      basicAuth:
        # Credential generated by the server's bootstrap Job (ITL.Prefect.Server)
        enabled: true
        existingSecret: prefect-server-basic-auth